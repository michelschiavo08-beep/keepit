# ============================================================
# CONFIGURAÇÃO DO SERVIDOR E BANCO DE DADOS - KEEPIT
# ============================================================

# Porta do Servidor Web (Padrão: 8080 ou configurada via variável PORT)
server.port=${PORT:8080}

# Fonte de Dados (Datasource)
# Suporta variáveis de ambiente (DB_URL, DB_USER, DB_PASS, DB_DRIVER).
# Se nenhuma variável for passada, utiliza H2 Database em memória automaticamente.
spring.datasource.url=${DB_URL:jdbc:h2:mem:keepitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# Console Web do H2 (Acessível em http://localhost:8080/h2-console quando em H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inicialização de Esquema SQL Automático
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
