# Configuração do Servidor Spring Boot
server.port=8080

# Configuração do Banco de Dados (Por padrão utiliza H2 em memória com inicialização do schema SQL)
spring.datasource.url=jdbc:h2:mem:keepitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração JPA e H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Para utilizar MySQL em produção, descomente as linhas abaixo:
